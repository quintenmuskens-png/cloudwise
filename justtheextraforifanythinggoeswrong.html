<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Glass Buttons</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        135deg,
        #00c6ff,
        #0072ff,
        #8e2de2,
        #ff0080
    );
    overflow:hidden;
}

/* Achtergrond bubbels */
body::before,
body::after{
    content:"";
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
}

body::before{
    width:300px;
    height:300px;
    background:#ffffff55;
    top:10%;
    left:10%;
}

body::after{
    width:400px;
    height:400px;
    background:#00ffff44;
    bottom:5%;
    right:5%;
}

.container{
    display:grid;
    grid-template-columns:repeat(3, 180px);
    gap:25px;
    z-index:1;
}

.glass-btn{
    position:relative;
    padding:20px;
    border:none;
    border-radius:20px;

    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,0.3);

    color:white;
    font-size:18px;
    font-weight:600;
    cursor:pointer;

    overflow:hidden;
    transition:all .35s ease;
    
    box-shadow:
        0 8px 32px rgba(0,0,0,0.25),
        inset 0 1px 1px rgba(255,255,255,0.5);
}

.glass-btn::before{
    content:"";
    position:absolute;
    width:200%;
    height:100%;
    top:0;
    left:-200%;
    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.4),
        transparent
    );
    transition:0.6s;
}

.glass-btn:hover::before{
    left:100%;
}

.glass-btn:hover{
    transform:translateY(-8px) scale(1.05);
    background:rgba(255,255,255,0.18);
    box-shadow:
        0 20px 40px rgba(0,0,0,0.35),
        inset 0 1px 2px rgba(255,255,255,0.7);
}

.glass-btn:active{
    transform:scale(0.95);
}
</style>
</head>

<body>

<div class="container">
    <button class="glass-btn">Home</button>
    <button class="glass-btn">Profiel</button>
    <button class="glass-btn">Instellingen</button>
    <button class="glass-btn">Downloads</button>
    <button class="glass-btn">Foto's</button>
    <button class="glass-btn">Muziek</button>
    <button class="glass-btn">Games</button>
    <button class="glass-btn">Berichten</button>
    <button class="glass-btn">Contact</button>
</div>

</body>
</html>
