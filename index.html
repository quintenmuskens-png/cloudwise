<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Glass Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#08090d;
    --border:rgba(255,255,255,.09);
    --text:#f4f5f7;
    --muted:#9ea1ad;
    --accent:#a78bfa;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:32px 16px;
    font-family:"Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at 12% 8%, rgba(124,58,237,.22), transparent 42%),
        radial-gradient(circle at 88% 18%, rgba(56,189,248,.14), transparent 40%),
        radial-gradient(circle at 50% 100%, rgba(236,72,153,.12), transparent 45%),
        var(--bg);
}

.container{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,180px));
    gap:16px;
    width:100%;
    max-width:628px;
    padding:26px;
    border:1px solid var(--border);
    border-radius:28px;
    background:linear-gradient(
        180deg,
        rgba(255,255,255,.07),
        rgba(255,255,255,.035)
    );
    box-shadow:0 24px 70px rgba(0,0,0,.42);
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
}

.glass-btn{
    position:relative;
    min-width:0;
    min-height:84px;
    padding:20px 12px;
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:18px;
    background:rgba(255,255,255,.045);
    color:#e6e7ec;
    font:inherit;
    font-size:14px;
    font-weight:500;
    line-height:1.5;
    cursor:pointer;
    transition:
        transform .16s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .2s ease,
        color .2s ease;
}

.glass-btn::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        135deg,
        rgba(167,139,250,.10),
        rgba(125,211,252,.05)
    );
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
}

.glass-btn:hover{
    background:rgba(255,255,255,.08);
    border-color:rgba(167,139,250,.3);
    color:#fff;
    transform:translateY(-2px);
    box-shadow:0 10px 24px rgba(0,0,0,.18);
}

.glass-btn:hover::before{
    opacity:1;
}

.glass-btn:active{
    transform:scale(.96);
}

.glass-btn:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:4px;
}

/* Popup */
.popup{
    position:fixed;
    z-index:10;
    top:24px;
    left:50%;
    transform:translate(-50%,-8px);
    width:max-content;
    max-width:calc(100% - 32px);
    padding:14px 22px;
    border:1px solid rgba(167,139,250,.24);
    border-radius:18px;
    background:linear-gradient(
        135deg,
        rgba(35,28,54,.96),
        rgba(20,29,40,.96)
    );
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    box-shadow:0 16px 48px rgba(0,0,0,.35);
    color:var(--text);
    font-size:14px;
    font-weight:500;
    line-height:1.5;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
}

.popup.show{
    opacity:1;
    transform:translate(-50%,0);
}

@supports not (backdrop-filter:blur(1px)){
    .container{
        background:#15161c;
    }

    .popup{
        background:#201c2c;
    }
}

/* Mobile */
@media(max-width:700px){
    .container{
        max-width:420px;
        grid-template-columns:repeat(2,minmax(0,1fr));
        padding:22px;
        gap:12px;
    }
}

@media(max-width:450px){
    body{
        padding:24px 12px;
    }

    .container{
        max-width:360px;
        grid-template-columns:1fr;
        padding:20px 16px;
        gap:10px;
    }

    .glass-btn{
        min-height:58px;
        padding:16px;
    }
}

@media(prefers-reduced-motion:reduce){
    .glass-btn,
    .glass-btn::before,
    .popup{
        transition:none;
    }
}
</style>
</head>

<body>

<div class="popup" id="popup">
    Welkom!
</div>

<div class="container">

<button class="glass-btn" onclick="showMessage('🏠 Home geopend')">🏠 Home</button>

<button class="glass-btn" onclick="showMessage('👤 Profiel geopend')">👤 Profiel</button>

<button class="glass-btn" onclick="showMessage('⚙️ Instellingen geopend')">⚙️ Instellingen</button>

<button class="glass-btn" onclick="showMessage('📥 Downloads geopend')">📥 Downloads</button>

<button class="glass-btn" onclick="showMessage('📸 Foto\'s geopend')">📸 Foto's</button>

<button class="glass-btn" onclick="showMessage('🎵 Muziek geopend')">🎵 Muziek</button>

<button class="glass-btn" onclick="showMessage('🎮 Games geopend')">🎮 Games</button>

<button class="glass-btn" onclick="showMessage('💬 Berichten geopend')">💬 Berichten</button>

<button class="glass-btn" onclick="showMessage('📞 Contacten geopend')">📞 Contacten</button>

</div>

<script>
const popup = document.getElementById("popup");

function showMessage(text){
    popup.textContent = text;
    popup.classList.add("show");

    clearTimeout(window.popupTimer);

    window.popupTimer = setTimeout(() => {
        popup.classList.remove("show");
    }, 2000);
}

/* Keyboard shortcuts */
document.addEventListener("keydown", (e) => {

    const shortcuts = {
        "1":"🏠 Home geopend",
        "2":"👤 Profiel geopend",
        "3":"⚙️ Instellingen geopend",
        "4":"📥 Downloads geopend",
        "5":"📸 Foto's geopend",
        "6":"🎵 Muziek geopend",
        "7":"🎮 Games geopend",
        "8":"💬 Berichten geopend",
        "9":"📞 Contacten geopend"
    };

    if(shortcuts[e.key]){
        showMessage(shortcuts[e.key]);
    }
});
</script>

</body>
</html>
