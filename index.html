<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Glass Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        135deg,
        #00c6ff,
        #0072ff,
        #8e2de2,
        #ff0080
    );
    overflow:hidden;
}

/* Background Glow */
body::before,
body::after{
    content:"";
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
}

body::before{
    width:300px;
    height:300px;
    background:#ffffff55;
    top:10%;
    left:10%;
}

body::after{
    width:400px;
    height:400px;
    background:#00ffff44;
    bottom:5%;
    right:5%;
}

.container{
    display:grid;
    grid-template-columns:repeat(3,180px);
    gap:25px;
    z-index:1;
}

.glass-btn{
    position:relative;
    padding:20px;
    border:none;
    border-radius:20px;

    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,0.3);

    color:white;
    font-size:18px;
    font-weight:600;
    cursor:pointer;

    overflow:hidden;
    transition:.35s ease;

    box-shadow:
        0 8px 32px rgba(0,0,0,.25),
        inset 0 1px 1px rgba(255,255,255,.5);

    animation:float 4s ease-in-out infinite;
}

.glass-btn:nth-child(even){
    animation-delay:1s;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-6px);
    }
}

.glass-btn::before{
    content:"";
    position:absolute;
    width:200%;
    height:100%;
    top:0;
    left:-200%;

    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,.4),
        transparent
    );

    transition:.6s;
}

.glass-btn:hover::before{
    left:100%;
}

.glass-btn:hover{
    transform:translateY(-8px) scale(1.05);
}

.glass-btn:active{
    transform:scale(.95);
}

/* Popup */
.popup{
    position:fixed;
    top:30px;
    left:50%;
    transform:translateX(-50%);

    padding:15px 30px;

    background:rgba(255,255,255,.15);
    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.3);

    border-radius:15px;

    color:white;
    font-size:18px;

    opacity:0;
    pointer-events:none;

    transition:.3s;
}

.popup.show{
    opacity:1;
}

/* Mobile */
@media(max-width:700px){
    .container{
        grid-template-columns:repeat(2,160px);
    }
}

@media(max-width:450px){
    .container{
        grid-template-columns:1fr;
        width:90%;
    }
}
</style>
</head>

<body>

<div class="popup" id="popup">
    Welkom!
</div>

<div class="container">

<button class="glass-btn" onclick="showMessage('🏠 Home geopend')">🏠 Home</button>

<button class="glass-btn" onclick="showMessage('👤 Profiel geopend')">👤 Profiel</button>

<button class="glass-btn" onclick="showMessage('⚙️ Instellingen geopend')">⚙️ Instellingen</button>

<button class="glass-btn" onclick="showMessage('📥 Downloads geopend')">📥 Downloads</button>

<button class="glass-btn" onclick="showMessage('📸 Foto\'s geopend')">📸 Foto's</button>

<button class="glass-btn" onclick="showMessage('🎵 Muziek geopend')">🎵 Muziek</button>

<button class="glass-btn" onclick="showMessage('🎮 Games geopend')">🎮 Games</button>

<button class="glass-btn" onclick="showMessage('💬 Berichten geopend')">💬 Berichten</button>

<button class="glass-btn" onclick="showMessage('📞 Contact geopend')">📞 Contact</button>

</div>

<script>
const popup = document.getElementById("popup");

function showMessage(text){
    popup.textContent = text;
    popup.classList.add("show");

    clearTimeout(window.popupTimer);

    window.popupTimer = setTimeout(() => {
        popup.classList.remove("show");
    }, 2000);
}

/* Keyboard shortcuts */
document.addEventListener("keydown", (e) => {

    const shortcuts = {
        "1":"🏠 Home geopend",
        "2":"👤 Profiel geopend",
        "3":"⚙️ Instellingen geopend",
        "4":"📥 Downloads geopend",
        "5":"📸 Foto's geopend",
        "6":"🎵 Muziek geopend",
        "7":"🎮 Games geopend",
        "8":"💬 Berichten geopend",
        "9":"📞 Contact geopend"
    };

    if(shortcuts[e.key]){
        showMessage(shortcuts[e.key]);
    }
});
</script>

</body>
</html>
